<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地牢爬行游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <h1>地牢爬行游戏</h1>
        
        <div id="theme-selector">
            <label for="theme">选择主题：</label>
            <select id="theme">
                <option value="cave">洞穴</option>
                <option value="graveyard">墓地</option>
                <option value="temple">神殿</option>
            </select>
        </div>
        
        <div id="stats">
            <div class="stat">
                <span>层数：</span>
                <span id="floor">1</span>
            </div>
            <div class="stat">
                <span>分数：</span>
                <span id="score">0</span>
            </div>
            <div class="stat">
                <span>生命：</span>
                <span id="health">100</span>/<span id="max-health">100</span>
            </div>
            <div class="stat">
                <span>攻击：</span>
                <span id="attack">10</span>
            </div>
            <div class="stat">
                <span>防御：</span>
                <span id="defense">5</span>
            </div>
            <div class="stat">
                <span>饥饿值：</span>
                <span id="hunger">100</span>/<span id="max-hunger">100</span>
            </div>
            <div class="stat">
                <span>钥匙：</span>
                <span id="keys">0</span>
            </div>
            <div class="stat">
                <span>宝藏：</span>
                <span id="treasures">0</span>
            </div>
            <div class="stat">
                <span>杀敌：</span>
                <span id="kills">0</span>
            </div>
        </div>
        
        <div id="game-map"></div>
        
        <div id="inventory">
            <h3>道具栏</h3>
            <div id="inventory-items"></div>
        </div>
        
        <div id="controls">
            <p>使用 WASD 移动</p>
            <p>按 1-3 使用对应道具</p>
            <p>按 R 重新开始游戏</p>
        </div>
        
        <div id="high-scores">
            <h3>最高记录</h3>
            <div class="record">
                <span>最高层数：</span>
                <span id="max-floor">0</span>
            </div>
            <div class="record">
                <span>总分：</span>
                <span id="total-score">0</span>
            </div>
        </div>
        
        <div id="game-over" class="hidden">
            <h2>游戏结束</h2>
            <p id="final-score"></p>
            <button id="restart-button">重新开始</button>
        </div>
    </div>
    
    <script type="module" src="dist/game.js"></script>
</body>
</html>
